# Development Docker Compose
version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: futureinnvo_db_dev
    environment:
      POSTGRES_DB: futureinnvo_dev
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d futureinnvo_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: futureinnvo_redis_dev
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data

  # Django Backend (Development)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: futureinnvo_backend_dev
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://dev_user:dev_password@db:5432/futureinnvo_dev
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=104.248.180.230,localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://104.248.180.230:3000,http://104.248.180.230:5174,http://localhost:3000,http://localhost:5173
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis
    command: python manage.py runserver 0.0.0.0:8000

  # React Frontend (Development)
  frontend:
    build:
      context: ./FUTUREINNVO_SOLO_DESIGN
      dockerfile: Dockerfile.dev
    container_name: futureinnvo_frontend_dev
    environment:
      - VITE_API_BASE_URL=http://104.248.180.230:8001/api/v1
      - VITE_EMAILJS_SERVICE_ID=service_dotbrub
      - VITE_EMAILJS_TEMPLATE_ID=template_2xxcsrq
      - VITE_EMAILJS_PUBLIC_KEY=M8ZdPyX2WzkQORfB8
    volumes:
      - ./FUTUREINNVO_SOLO_DESIGN:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_dev_data:
  redis_dev_data:
