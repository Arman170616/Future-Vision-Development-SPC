version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: futureinnvo_db
    environment:
      POSTGRES_DB: futureinnvo_db
      POSTGRES_USER: futureinnvo_user
      POSTGRES_PASSWORD: futureinnvo_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futureinnvo_user -d futureinnvo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: futureinnvo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Django Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: futureinnvo_backend
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://futureinnvo_user:futureinnvo_password@db:5432/futureinnvo_db
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=104.248.180.230,localhost,127.0.0.1,backend,frontend
      - CORS_ALLOWED_ORIGINS=http://104.248.180.230,http://104.248.180.230:3000,http://104.248.180.230:80,http://frontend
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/activities/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./FUTUREINNVO_SOLO_DESIGN
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://104.248.180.230:8000/api/v1
        VITE_EMAILJS_SERVICE_ID: service_dotbrub
        VITE_EMAILJS_TEMPLATE_ID: template_2xxcsrq
        VITE_EMAILJS_PUBLIC_KEY: M8ZdPyX2WzkQORfB8
    container_name: futureinnvo_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: futureinnvo_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/sites-available:/etc/nginx/sites-available
      - ./nginx/ssl:/etc/nginx/ssl
      - static_volume:/var/www/static
      - media_volume:/var/www/media
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  default:
    name: futureinnvo_network
